<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NowShowing — Find Something to Watch</title>
<meta name="description" content="Search and stream movies and TV shows from multiple free sources, with watchlist and continue-watching built in.">
<meta name="theme-color" content="#0a0a0d">
<meta property="og:title" content="NowShowing">
<meta property="og:description" content="Search and stream movies and TV shows.">
<meta property="og:type" content="website">
<link rel="icon" href="public/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="public/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>

<nav class="nav" id="navbar"></nav>
<div class="mobile-menu" id="mobile-menu"></div>

<section class="hero" id="hero-section"></section>

<main>
  <div id="main-content"></div>
</main>

<!-- VIDEO / DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Title details">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>

    <div class="player-area">
      <div class="player-wrapper" id="player-wrapper">
        <div class="player-blank" id="player-blank"></div>
      </div>
      <div class="player-notice">
        <span>These are third-party free sources. If one is blank or blocked, switch sources below — Open in Tab always works as a fallback.</span>
      </div>
    </div>

    <div class="sources-bar" id="sources-bar"></div>

    <div class="se-bar" id="se-bar" style="display:none">
      <label>Season</label>
      <select id="season-select"></select>
      <label>Episode</label>
      <select id="episode-select"></select>
    </div>

    <div class="modal-details">
      <img class="modal-poster" id="modal-poster" src="" alt="">
      <div class="modal-info">
        <h2 id="modal-title"></h2>
        <div class="tags" id="modal-tags"></div>
        <p class="modal-plot" id="modal-plot"></p>
        <div class="modal-actions">
          <button class="wl-btn btn-ghost" id="wl-btn"></button>
        </div>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
    </div>

    <div class="recs-section" id="recs-section" style="display:none">
      <h3>You Might Also Like</h3>
      <div class="recs-grid" id="recs-grid"></div>
    </div>
  </div>
</div>

<!-- ABOUT MODAL -->
<div class="info-modal" id="info-modal"></div>

<footer class="site-footer">
  <p>&copy; 2026 NowShowing &mdash; Powered by <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb</a></p>
  <div class="foot-links">
    <span class="kbd">/</span>&nbsp;to search
    <span style="width:1rem"></span>
    <span class="kbd">Esc</span>&nbsp;to close
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
